<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ให้มันม่วง</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Mali", cursive;
            background:
                radial-gradient(circle at 10% 20%, #ffd9e5 0, transparent 25%),
                radial-gradient(circle at 90% 80%, #ffe7ef 0, transparent 25%),
                #fff7fa;
            color: #633d4d;
            min-height: 100vh;
        }

        /* ---------------- HEADER ---------------- */

        header {
            height: 75px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid #ffd6e2;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: "Itim";
            font-size: 32px;
            color: #df6687;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav button {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 16px;
            color: #75495b;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 15px;
            transition: 0.3s;
        }

        nav button:hover,
        nav button.active {
            background: #ffe1ea;
            color: #d95076;
        }

        .couple-name {
            background: #ffe6ed;
            padding: 10px 18px;
            border-radius: 25px;
            color: #d65376;
            font-weight: bold;
        }

        /* ---------------- LAYOUT ---------------- */

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
            display: grid;
            grid-template-columns: 220px 1fr 270px;
            gap: 25px;
        }

        /* ---------------- SIDEBAR ---------------- */

        .sidebar {
            background: rgba(255,255,255,0.85);
            border: 1px solid #ffd8e3;
            border-radius: 25px;
            padding: 20px;
            height: fit-content;
            box-shadow: 0 10px 30px rgba(220, 100, 130, 0.08);
        }

        .sidebar h2 {
            color: #df5c7c;
            margin-bottom: 20px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu button {
            border: none;
            background: transparent;
            padding: 13px;
            border-radius: 15px;
            text-align: left;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            color: #71495a;
            transition: 0.25s;
        }

        .menu button:hover,
        .menu button.active {
            background: #ffe0e9;
            color: #d94e72;
        }

        .mini-couple {
            margin-top: 35px;
            text-align: center;
            font-size: 45px;
        }

        .mini-couple p {
            font-size: 13px;
            line-height: 1.7;
            margin-top: 10px;
        }

        /* ---------------- MAIN ---------------- */

        .hero {
            background: rgba(255,255,255,0.88);
            border-radius: 28px;
            border: 1px solid #ffd6e2;
            padding: 18px;
            box-shadow: 0 15px 40px rgba(220, 100, 130, 0.08);

            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            align-items: center;
        }

        .hero img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 20px;
            border: 7px solid white;
            box-shadow: 0 8px 20px rgba(100, 50, 70, 0.15);
        }

        .hero-text {
            padding: 20px;
            text-align: center;
        }

        .hero-text h1 {
            font-family: "Itim";
            font-size: 40px;
            color: #d95076;
            margin-bottom: 15px;
        }

        .hero-text p {
            font-size: 20px;
            line-height: 2;
        }

        .heart {
            color: #e65d82;
        }

        /* ---------------- LOVE LETTER ---------------- */

        .love-letter {
            margin-top: 25px;
            background: rgba(255,255,255,0.9);
            border: 1px solid #ffd6e2;
            border-radius: 25px;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .love-letter h2 {
            color: #db5477;
            margin-bottom: 20px;
            font-size: 25px;
        }

        .love-letter p {
            line-height: 2.1;
            font-size: 17px;
        }

        .signature {
            text-align: right;
            margin-top: 20px;
            font-size: 20px;
            color: #d65376;
        }

        /* ---------------- REASONS ---------------- */

        .reasons {
            margin-top: 25px;
        }

        .reasons h2 {
            margin-bottom: 15px;
        }

        .reason-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .reason {
            background: #fff0f5;
            border-radius: 18px;
            padding: 20px 10px;
            text-align: center;
            transition: 0.3s;
            border: 1px solid #ffe0e8;
        }

        .reason:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(220,100,130,0.15);
        }

        .reason .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .reason p {
            font-size: 14px;
        }

        /* ---------------- RIGHT PANEL ---------------- */

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.88);
            border: 1px solid #ffd6e2;
            border-radius: 22px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(220, 100, 130, 0.07);
        }

        .card h3 {
            color: #d65376;
            margin-bottom: 15px;
        }

        /* ---------------- COUNTER ---------------- */

        .counter {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .counter div {
            background: #fff0f4;
            border-radius: 15px;
            padding: 10px;
            min-width: 55px;
        }

        .counter strong {
            display: block;
            color: #d65376;
            font-size: 22px;
        }

        .counter span {
            font-size: 11px;
        }

        /* ---------------- QUOTE ---------------- */

        .quote {
            background: #fff0f5;
            border-radius: 18px;
            padding: 18px;
            line-height: 1.8;
            font-size: 14px;
            position: relative;
        }

        /* ---------------- PHOTO ---------------- */

        .photo-card img {
            width: 100%;
            border-radius: 15px;
        }

        /* ---------------- MUSIC ---------------- */

        .music-player {
            text-align: center;
        }

        .music-cover {
            width: 80px;
            height: 80px;
            margin: auto;
            border-radius: 18px;
            background: linear-gradient(135deg, #ffb6ca, #ffdce7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            margin-bottom: 12px;
        }

        .music-player button {
            border: none;
            background: #df5c7c;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        /* ---------------- FOOTER ---------------- */

        footer {
            text-align: center;
            padding: 50px 20px;
            color: #d15b78;
            font-size: 16px;
        }

        /* ---------------- FLOATING HEARTS ---------------- */

        .floating-heart {
            position: fixed;
            bottom: -30px;
            pointer-events: none;
            animation: floatUp 5s linear forwards;
            z-index: 999;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(25deg) scale(1.5);
                opacity: 0;
            }
        }

        /* ---------------- RESPONSIVE ---------------- */

        @media (max-width: 1100px) {

            .container {
                grid-template-columns: 180px 1fr;
            }

            .right-panel {
                grid-column: 1 / -1;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 750px) {

            header {
                padding: 0 15px;
            }

            nav {
                display: none;
            }

            .container {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            .sidebar {
                display: none;
            }

            .hero {
                grid-template-columns: 1fr;
            }

            .hero img {
                height: 250px;
            }

            .reason-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .right-panel {
                grid-template-columns: 1fr;
            }

        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">
            Rak Tawan🌻
        </div>

        

        <div class="couple-name">
            ตะวัน ♡ ดีเจ
        </div>

    </header>


    <!-- ================= MAIN LAYOUT ================= -->

    <div class="container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2>💗 เมนู</h2>

            <div class="menu">

                <button class="active">
                    🏠 หน้าแรก
                </button>

              

                <button onclick="scrollToPhoto()">
                        eiei
               
            </div>

           

        </aside>


        <!-- MAIN CONTENT -->

        <main>

            <!-- HERO -->

            <section class="hero">

                <img src="couple.png" alt="รูปของเราสองคน">

                <div class="hero-text">

                    <h1>
                            เป็นกำลังใจให้น้อนตาวาน<br>
                        
                        <span class="heart">♥</span>
                    </h1>

                    <p>
                    ช่วงนี้น้อนตะวันงานเยอะ เป็นกำลังใจให้น๊าา<br>
                    
                        
                    </p>

                    <p style="margin-top:20px;">
                        ♡ ร้ากกๆน้อนวรรณ ♡
                    </p>

                </div>

            </section>


          

            <!-- MUSIC -->
<div class="card">

    <h3> 🐶🌻 </h3>

    <p style="margin-bottom: 15px;">
       
    </p>

    <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/track/0V3sKBY7Iypaufb6RzR3Er"
        width="100%"
        height="152"
        frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
    </iframe>

</div>
            


            <!-- PHOTO -->

            <div class="card photo-card" id="photoCard">

                <h3>
                    📷
                </h3>

                <img src="tawan.png" \>

                <p style="font-size:13px;text-align:center;margin-top:13px;">
                    รักมันม่วง
                </p>

            </div>

        </aside>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        


        /* --------------------------------
           เลื่อนไปยังรูป
        -------------------------------- */

        function scrollToPhoto() {

            document
                .getElementById("photoCard")
                .scrollIntoView({
                    behavior: "smooth"
                });

        }


       


        /* --------------------------------
           สร้างหัวใจลอย
        -------------------------------- */

        function createHeart() {

            const heart =
                document.createElement("div");

            heart.className = "floating-heart";

            heart.textContent = "❤️";

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.fontSize =
                (20 + Math.random() * 25) + "px";

            document.body.appendChild(heart);


            setTimeout(() => {

                heart.remove();

            }, 5000);

        }


        /* สร้างหัวใจอัตโนมัติ */

        setInterval(() => {

            if (Math.random() > 0.5) {
                createHeart();
            }

        }, 2500);


        /* --------------------------------
           Music Button
        -------------------------------- */

        let playing = false;

        function toggleMusic() {

            const button =
                document.getElementById("musicButton");

            playing = !playing;

            if (playing) {

                button.textContent = "❚❚";

                alert(
                    "ตรงนี้สามารถใส่เพลงของเราได้ 🎵❤️"
                );

            } else {

                button.textContent = "▶";

            }

        }

    </script>

</body>
</html>
